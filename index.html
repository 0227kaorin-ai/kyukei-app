<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101b33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>東京シャトールージュ 休憩メモ</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eef2f8;color:#162138;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
header{background:#111c33;color:#fff;text-align:center;padding:28px 12px;border-radius:0 0 25px 25px}
h1{font-size:25px;margin:8px 0}header small{color:#ccd6ea}
main{max-width:560px;margin:auto;padding:15px}
section{background:white;border-radius:22px;padding:20px;margin-bottom:15px;box-shadow:0 3px 12px #1723410a}
label{font-size:14px;font-weight:bold;display:block;margin:8px 0}
input,select{width:100%;padding:15px;border:2px solid #d5deeb;border-radius:12px;font-size:18px;background:white;color:#162138}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#edf2f8;padding:16px;border-radius:16px}
.stat strong{display:block;font-size:27px;margin-top:5px}
button{width:100%;border:0;border-radius:15px;padding:20px 12px;font-size:19px;font-weight:bold;margin:7px 0;cursor:pointer}
button:disabled{opacity:.4}
.blue{background:#203f9e;color:white}
.gray{background:#dce3ed;color:#172138}
.green{background:#167c51;color:white}
.outline{background:#f0f3f8;color:#172138;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #dce3ed;font-size:14px}
.row b{font-size:15px}.muted{color:#68788e;font-size:13px}
#active{display:none;text-align:center;background:#fff9dc;border:2px solid #e6ba4b}
#active strong{font-size:22px}h2{font-size:20px}
.warning{color:#a43728;font-size:13px;line-height:1.6}
</style>
</head>
<body>
<header><small>TOKYO CHATEAU ROUGE</small><h1>休憩時間メモ</h1><small>各自のスマホで記録 → 最後に用紙へ手書き</small></header>
<main>
<section>
<label>スタッフ名</label><input id="staff" placeholder="お名前">
<label>勤務日（出勤した日）</label><input type="date" id="day">
<label>勤務形態</label>
<select id="shift"><option value="short">片番勤務 16:30〜翌1:30</option><option value="long">通し勤務 10:30〜翌1:30</option></select>
</section>
<section>
<div class="stats">
<div class="stat">タバコ（各5分）<strong id="sc">0 / 8</strong></div>
<div class="stat">食事<strong id="mc">0 / 1</strong><span id="mealrule" class="muted">各20分</span></div>
</div>
<div id="actions">
<button class="blue" id="smoke" onclick="startBreak('smoke')">🚬 タバコ休憩に行く</button>
<button class="gray" id="meal" onclick="startBreak('meal')">🍱 食事休憩に行く</button>
</div>
</section>
<section id="active"><strong id="activeTitle"></strong><p id="activeTime"></p><button class="green" onclick="finishBreak()">✅ 戻りました！</button></section>
<section><h2>📝 紙に書き写す記録</h2><div id="history" class="muted">まだ記録はありません</div><button class="outline" onclick="copyRecords()">📋 記録をコピー</button></section>
<section><button class="outline" onclick="resetDay()">🔄 次の勤務用にリセット</button><p class="warning">記録はこの端末・このブラウザ内に保存します。ブラウザデータ削除や別端末への変更で消えることがあります。勤務終了後は紙に転記してください。</p></section>
</main>
<script>
const KEY='chateau_break_v1';
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
let data;
try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!data||!Array.isArray(data.logs))data={staff:'',day:today(),shift:'short',logs:[],active:null};
const el=id=>document.getElementById(id);
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){alert('保存できません。記録をコピーして控えてください。')}}
function timestamp(){const d=new Date();return {iso:d.toISOString(),label:String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}}
function limits(){return data.shift==='short'?{smoke:8,meal:1,minutes:20}:{smoke:12,meal:2,minutes:30}}
function count(kind){return data.logs.filter(r=>r.kind===kind).length+(data.active&&data.active.kind===kind?1:0)}
function duration(a,b){return Math.max(0,Math.round((new Date(b).getTime()-new Date(a).getTime())/60000))}
function render(){
el('staff').value=data.staff;el('day').value=data.day;el('shift').value=data.shift;
const max=limits();el('sc').textContent=count('smoke')+' / '+max.smoke;el('mc').textContent=count('meal')+' / '+max.meal;el('mealrule').textContent='各'+max.minutes+'分';
el('actions').style.display=data.active?'none':'block';el('active').style.display=data.active?'block':'none';
el('smoke').disabled=count('smoke')>=max.smoke;el('meal').disabled=count('meal')>=max.meal;
el('shift').disabled=!!data.active||data.logs.length>0;
if(data.active){el('activeTitle').textContent=(data.active.kind==='smoke'?'🚬 タバコ':'🍱 食事')+'休憩中';el('activeTime').textContent='出発：'+data.active.out.label}
const n={smoke:0,meal:0};const h=el('history');h.innerHTML='';
if(!data.logs.length)h.textContent='まだ記録はありません';
data.logs.forEach(r=>{n[r.kind]++;const div=document.createElement('div');div.className='row';const left=document.createElement('b');left.textContent=(r.kind==='smoke'?'🚬 タバコ':'🍱 食事')+n[r.kind]+'回目';const right=document.createElement('span');right.textContent=r.out.label+' → '+r.back.label+'（'+duration(r.out.iso,r.back.iso)+'分）';div.append(left,right);h.append(div)})
}
el('staff').addEventListener('input',e=>{data.staff=e.target.value;save()});
el('day').addEventListener('change',e=>{data.day=e.target.value;save()});
el('shift').addEventListener('change',e=>{if(!data.active&&!data.logs.length){data.shift=e.target.value;save();render()}});
function startBreak(kind){
if(data.active)return;
const max=limits();if(count(kind)>=max[kind])return;
data.active={kind:kind,out:timestamp()};save();render()
}
function finishBreak(){
if(!data.active)return;
data.logs.push({...data.active,back:timestamp()});data.active=null;save();render()
}
function recordText(){
let n={smoke:0,meal:0};
return ['東京シャトールージュ 休憩記録','スタッフ：'+data.staff,'勤務日：'+data.day,'勤務：'+(data.shift==='short'?'片番':'通し'),...data.logs.map(r=>{n[r.kind]++;return (r.kind==='smoke'?'タバコ':'食事')+n[r.kind]+'回目 '+r.out.label+' → '+r.back.label+' ('+duration(r.out.iso,r.back.iso)+'分)'})].join('\n')
}
async function copyRecords(){
const t=recordText();
try{await navigator.clipboard.writeText(t);alert('記録をコピーしました')}catch(e){const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();document.execCommand('copy');a.remove();alert('記録をコピーしました')}
}
function resetDay(){
if(!confirm('記録をすべて消去して次の勤務を始めますか？'))return;
data={staff:data.staff,day:today(),shift:data.shift,logs:[],active:null};save();render()
}
render();
</script>
</body>
</html>
